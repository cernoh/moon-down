[package]
name = "moon-down-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Engine crate for moon-down (embedded aria2-rust daemon)"

[dependencies]
moon-down-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rand = "0.8"
# setsid(2) in Command::pre_exec, to detach the daemon before exec.
libc = "0.2"
# No default features: the daemon is bound to loopback only, so TLS is dead weight.
ureq = { version = "2", default-features = false }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
zip = "2"
flate2 = "1"
tar = "0.4"
